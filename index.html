<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Anak SD</title>
<style>
:root{--bg:#10243d;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1626}}
:root[data-theme="dark"]{--bg:#0b1626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#w{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#000;display:block}
.b{position:absolute;bottom:14px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.7);color:#fff;font:700 26px system-ui;display:flex;align-items:center;justify-content:center}
#t{display:none}
</style></head><body><div id="w"><canvas id="c" width="800" height="450"></canvas>
<div id="t"><div class="b" id="bl" style="left:14px">◀</div><div class="b" id="br" style="left:100px">▶</div><div class="b" id="bb" style="right:100px">B</div><div class="b" id="ba" style="right:14px">A</div></div></div>
<script>
const cv=document.getElementById('c'),c=cv.getContext('2d'),T=32,TS=document.getElementById('t');
let st='menu',sel=0,lvl=0,lives=3,score=0,coins=0,fr=0,L,p,P=[],cam=0,tmr=0,cpx=0,mus=true;
const K={l:0,r:0,a:0,b:0},NM=['Jalan ke Sekolah','Sore di Sawah','Malam Lomba 17-an'];
function rs(){const s=Math.min(innerWidth/800,innerHeight/450);cv.style.width=800*s+'px';cv.style.height=450*s+'px'}
addEventListener('resize',rs);rs();
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
// ---------- AUDIO ----------
let AC,nt=0,si=0;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}
function tn(f,t,d,ty,v,sl){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const mf=m=>440*Math.pow(2,(m-69)/12);
function sfx(k){if(!AC)return;const t=AC.currentTime;
 if(k=='jump')tn(300,t,.2,'square',.06,760);
 if(k=='coin'){tn(988,t,.08,'square',.06);tn(1319,t+.07,.18,'square',.06)}
 if(k=='stomp')tn(220,t,.15,'sawtooth',.1,60);
 if(k=='bump')tn(120,t,.1,'triangle',.15,80);
 if(k=='hurt')tn(420,t,.5,'sawtooth',.09,70);
 if(k=='win')[72,76,79,84,79,84].forEach((m,i)=>tn(mf(m),t+i*.12,.2,'square',.06));
 if(k=='over')[67,64,60,55].forEach((m,i)=>tn(mf(m),t+i*.25,.3,'triangle',.1))}
const MEL=[72,0,76,0,79,76,0,72,74,0,77,0,81,77,0,74,76,0,79,0,84,79,0,76,72,74,76,79,76,74,72,0],
BAS=[48,0,55,0,48,0,55,0,53,0,60,0,53,0,60,0,55,0,62,0,55,0,62,0,48,0,55,0,52,0,55,0];
function music(){if(!AC||!mus||st!='play'||NEWM)return;const sd=60/(138+lvl*6)/2,tr=[0,3,-2,2,-4,5][lvl];
 while(nt<AC.currentTime+.2){if(nt<AC.currentTime)nt=AC.currentTime;const i=si%32;
  if(MEL[i])tn(mf(MEL[i]+tr),nt,sd*1.6,'square',.028);
  if(BAS[i])tn(mf(BAS[i]+tr),nt,sd*1.8,'triangle',.09);
  if(i%4==2)tn(8000,nt,.03,'square',.008);
  nt+=sd;si++}}
setInterval(music,50);
// ---------- LEVEL ----------
function build(n){const r=rnd(n*131+7),W=140+Math.min(n,3)*30+Math.max(0,nq-4)*8,m=[];
 for(let y=0;y<14;y++)m.push(new Array(W).fill(0));
 for(let x=0;x<W;x++){m[12][x]=1;m[13][x]=1}
 const co=[],en=[],mid=W>>1;let x=10,cd=0;
 const E=(ex)=>en.push({x:ex*T,y:12*T-24,w:26,h:24,vx:-(.6+n*.15),vy:0,d:0});
 while(x<W-14){
  if(!cd&&x>=mid-4){x=mid+5;cd=1;continue}
  const t=r();
  if(t<.2+Math.min(n,3)*.05){const w=2+(n>0&&r()<.4?1:0);
   for(let i=0;i<w;i++){m[12][x+i]=0;m[13][x+i]=0}
   for(let i=0;i<w+2;i++)co.push({x:(x-1+i)*T+16,y:(8+Math.pow(i-(w+1)/2,2)*.35)*T});
   x+=w+4}
  else if(t<.5){const len=3+(r()*3|0);
   for(let i=0;i<len;i++){m[9][x+1+i]=r()<.55?3:2;co.push({x:(x+1+i)*T+16,y:8*T+8})}
   if(r()<.7)E(x+1+(len>>1));x+=len+4}
  else if(t<.65){const h=2+(r()*2|0);
   for(let i=0;i<h;i++)for(let j=0;j<=i;j++)m[11-j][x+i]=2;x+=h+3}
  else{E(x);if(n>0&&r()<.5)E(x+2);
   for(let i=0;i<3;i++)co.push({x:(x+i)*T+16,y:10*T+8});x+=5}}
 return{m,W,co,en,fx:(W-8)*T}}
function start(n){lvl=n;L=build(n);p={x:3*T,y:9*T,w:20,h:30,vx:0,vy:0,g:0,f:1,an:0,cg:0,jb:0,inv:90};
 cpx=3*T;cam=0;P=[];st='play';TS.style.display=('ontouchstart' in window||navigator.maxTouchPoints>0)?'block':'none';nt=0;si=0}
function newGame(){ac();lives=3;score=0;coins=0;start(0)}
// ---------- PHYSICS ----------
function solid(tx,ty){if(ty<0||ty>=14)return false;if(tx<0||tx>=L.W)return true;return L.m[ty][tx]>0}
function mv(e){let bump=null,hit=false;
 e.x=Math.max(0,e.x+e.vx);
 for(let ty=(e.y/T)|0;ty<=((e.y+e.h-.01)/T)|0;ty++)for(let tx=(e.x/T)|0;tx<=((e.x+e.w-.01)/T)|0;tx++)if(solid(tx,ty)){hit=true;if(e.vx>0)e.x=tx*T-e.w;else e.x=(tx+1)*T}
 e.y+=e.vy;e.g=0;
 for(let ty=(Math.max(e.y,0)/T)|0;ty<=((e.y+e.h-.01)/T)|0;ty++)for(let tx=(e.x/T)|0;tx<=((e.x+e.w-.01)/T)|0;tx++)if(solid(tx,ty)){
  if(e.vy>0){e.y=ty*T-e.h;e.g=1;e.vy=0}else if(e.vy<0){e.y=(ty+1)*T;e.vy=0;bump=[tx,ty]}}
 return{hit,bump}}
function spark(x,y,col,n){for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*5,l:30,c:col})}
function lose(){lives--;sfx('hurt');if(lives<=0){st='over';sfx('over');TS.style.display='none';return}
 p.x=cpx;p.y=9*T;p.vx=p.vy=0;p.inv=120}
function upd(){fr++;
 if(st=='lvl'){if(--tmr<=0){if(lvl<NL-1)toShop();else{st='win';TS.style.display='none'}}return}
 if(st!='play')return;
 const tg=(K.r-K.l)*(K.b?3.6:3.0);p.vx+=(tg-p.vx)*(p.g?.2:.1);if(Math.abs(p.vx)<.05&&!tg)p.vx=0;
 if(tg)p.f=tg>0?1:-1;
 if(p.g)p.cg=6;else p.cg--;p.jb--;
 if(p.jb>0&&p.cg>0){p.vy=K.b?-11:-10.2;p.cg=0;p.jb=0;sfx('jump')}
 if(!K.a&&p.vy<-3.5)p.vy*=.6;
 p.vy=Math.min(p.vy+.5,10);
 const r=mv(p);
 if(r.bump){const[bx,by]=r.bump;if(L.m[by][bx]==3){L.m[by][bx]=4;bumpBlk(bx,by)}else sfx('bump')}
 p.an+=Math.abs(p.vx)*.12;if(p.inv>0)p.inv--;
 
 if(p.y>520)lose();
 for(const q of L.co)if(!q.g&&Math.abs(p.x+10-q.x)<18&&Math.abs(p.y+15-q.y)<22){q.g=1;coins++;score+=50;sfx('coin');spark(q.x,q.y,'#ffe45c',6)}
 for(const e of L.en){if(e.d){e.d--;continue}
  e.vy=Math.min(e.vy+.5,10);const o=mv(e);
  if(o.hit||(e.g&&!solid(((e.vx>0?e.x+e.w+2:e.x-2)/T)|0,((e.y+e.h+4)/T)|0)))e.vx*=-1;
  if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
   if(p.vy>0&&p.y+p.h-e.y<20){e.d=18;p.vy=K.a?-9:-6;score+=200;sfx('stomp');spark(e.x+13,e.y+10,'#e08a2c',8)}
   else if(p.inv<=0)hitP(e)}}
 L.en=L.en.filter(e=>e.d!==1);
 if(p.x+p.w>L.fx){st='lvl';tmr=170;score+=1000+lives*300;sfx('win');for(let i=0;i<40;i++)spark(L.fx+20,150,['#d6102a','#fff','#ffd23a'][i%3],1);TS.style.display='none'}
 cam+=(Math.max(0,Math.min(p.x-300,L.W*T-800))-cam)*.12;
 for(const q of P){q.x+=q.vx;q.y+=q.vy;q.vy+=.25;q.l--}P=P.filter(q=>q.l>0)}
// ---------- DRAW ----------
function kid(x,y,f,an,girl,air,s){s=s||1;c.save();c.translate(x+10*s,y);c.scale(f*s,s);
 const sw=air?3:Math.sin(an)*4;
 c.fillStyle='#c8102e';c.fillRect(-13,10,7,12);c.fillStyle='#fff';c.fillRect(-13,15,7,2);
 c.fillStyle='#fff';c.fillRect(-6+sw,22,5,6);c.fillRect(1-sw,22,5,6);
 c.fillStyle='#222';c.fillRect(-7+sw,27,7,3);c.fillRect(0-sw,27,7,3);
 c.fillStyle='#d6102a';
 if(girl){c.beginPath();c.moveTo(-6,17);c.lineTo(6,17);c.lineTo(9,25);c.lineTo(-9,25);c.fill()}else c.fillRect(-7,17,14,7);
 c.fillStyle='#fff';c.fillRect(-7,9,14,9);c.fillStyle='#d6102a';c.fillRect(0,9,2,6);
 c.fillStyle='#fff';c.fillRect(-2+sw*.6,10,4,6);c.fillStyle='#f1b98a';c.fillRect(-2+sw*.6,15,4,3);
 c.fillStyle='#f1b98a';c.beginPath();c.arc(0,4,7,0,7);c.fill();
 c.fillStyle='#1a1a1a';c.beginPath();c.arc(0,3,7.5,Math.PI,0);c.fill();c.fillRect(-7.5,3,3,3);
 if(girl){c.beginPath();c.arc(-9,6,3.5,0,7);c.fill();c.fillStyle='#d6102a';c.fillRect(-9,2,4,3)}
 else{c.fillStyle='#d6102a';c.fillRect(-1,-4,8,2)}
 c.fillStyle='#111';c.fillRect(2,4,2,3);c.restore()}
function snail(e){const x=e.x-cam;c.save();c.translate(x+13,e.y+24);c.scale(e.vx>0?-1:1,e.d?.35:1);
 c.fillStyle='#b9c27a';c.beginPath();c.ellipse(0,-6,13,6,0,0,7);c.fill();c.beginPath();c.arc(-10,-12,5,0,7);c.fill();
 c.strokeStyle='#b9c27a';c.lineWidth=2;c.beginPath();c.moveTo(-12,-16);c.lineTo(-14,-22);c.moveTo(-8,-16);c.lineTo(-7,-22);c.stroke();
 c.fillStyle='#e08a2c';c.beginPath();c.arc(3,-12,9,0,7);c.fill();c.strokeStyle='#8a4a10';c.beginPath();c.arc(3,-12,5,0,5);c.stroke();
 c.fillStyle='#111';c.fillRect(-13,-14,2,3);c.restore()}
function bg(n){
 const TH=[['#4fc3ff','#d6f3ff'],['#ff8a5b','#ffe3a3'],['#0a1640','#3b4f9e']][n],g=c.createLinearGradient(0,0,0,450);
 g.addColorStop(0,TH[0]);g.addColorStop(1,TH[1]);c.fillStyle=g;c.fillRect(0,0,800,450);
 c.fillStyle=n==2?'#fff6c8':'#fff3a0';c.beginPath();c.arc(640,n==1?200:90,n==1?46:34,0,7);c.fill();
 if(n==2){c.fillStyle='#fff';for(let i=0;i<40;i++)if((i+(fr>>4))%5)c.fillRect((i*97)%800,(i*53)%240,2,2)}
 c.fillStyle=n==2?'rgba(255,255,255,.18)':'rgba(255,255,255,.85)';
 for(let i=0;i<6;i++){const x=(((i*230-cam*.1+fr*.15)%1400)+1400)%1400-200,y=50+(i*47)%110;
  c.beginPath();c.arc(x,y,20,0,7);c.arc(x+22,y-8,26,0,7);c.arc(x+48,y,20,0,7);c.fill()}
 c.fillStyle=n==2?'#2a3a73':n==1?'#7a5a7a':'#6f93b5';
 for(let i=0;i<3;i++){const x=(((i*520-cam*.2)%1560)+1560)%1560-300;c.beginPath();c.moveTo(x,340);c.lineTo(x+150,170);c.lineTo(x+300,340);c.fill()}
 c.fillStyle=n==2?'#1c4a3a':n==1?'#5a8a3a':'#3fa04a';c.beginPath();c.moveTo(0,450);
 for(let x=0;x<=800;x+=20)c.lineTo(x,350+Math.sin((x+cam*.4)/90)*18);c.lineTo(800,450);c.fill();
 for(let i=0;i<5;i++){const x=(((i*240-cam*.6)%1200)+1200)%1200-100;
  c.strokeStyle=n==2?'#3a2a1a':'#7a5230';c.lineWidth=5;c.beginPath();c.moveTo(x,384);c.quadraticCurveTo(x+12,340,x+6,296);c.stroke();
  c.strokeStyle=n==2?'#1d6a3a':'#2e9a3e';c.lineWidth=4;for(let k=0;k<5;k++){const a=k*1.25-.3;c.beginPath();c.moveTo(x+6,296);c.lineTo(x+6+Math.cos(a+3.1)*26,296+Math.sin(a+3.1)*-12+10);c.stroke()}}
 if(n==2){c.fillStyle='rgba(0,10,40,.3)';c.fillRect(0,0,800,450)}}
function world(){const n=lvl;bg(n);
 // sekolah
 let sx=lvl<3?40-cam:-999;c.fillStyle='#f3e9d2';c.fillRect(sx,274,190,110);c.fillStyle='#b5301f';c.beginPath();c.moveTo(sx-10,274);c.lineTo(sx+95,236);c.lineTo(sx+200,274);c.fill();
 c.fillStyle='#8a5a2b';c.fillRect(sx+80,324,30,60);c.fillStyle='#8fd0ff';c.fillRect(sx+20,300,34,30);c.fillRect(sx+136,300,34,30);
 c.fillStyle='#d6102a';c.fillRect(sx+60,284,70,16);c.fillStyle='#fff';c.font='bold 13px system-ui';c.textAlign='center';c.fillText('SD NUSANTARA',sx+95,296);
 // tiles
 const a=Math.max(0,(cam/T)|0),b=Math.min(L.W,a+27);
 for(let x=a;x<b;x++)for(let y=0;y<14;y++){const t=L.m[y][x];if(!t)continue;const px=x*T-cam,py=y*T;
  if(t==1){if(y==12){c.fillStyle='#8a5a2b';c.fillRect(px,py,T,T);c.fillStyle='#3fae3a';c.fillRect(px,py,T,9);c.fillStyle='#2f8f2c';c.fillRect(px,py+8,T,2)}
   else{c.fillStyle='#6f4520';c.fillRect(px,py,T,T);c.fillStyle='#5a3515';c.fillRect(px+8,py+8,4,4);c.fillRect(px+20,py+18,4,4)}}
  else if(t==2){c.fillStyle='#b5442c';c.fillRect(px,py,T,T);c.fillStyle='#7c2a1b';c.fillRect(px,py+15,T,2);c.fillRect(px+15,py,2,16);c.fillRect(px+7,py+16,2,16);c.fillRect(px+23,py+16,2,16)}
  else{c.fillStyle=t==3?'#ffc83a':'#8a7a66';c.fillRect(px,py,T,T);c.strokeStyle=t==3?'#b57d00':'#5a4d3d';c.lineWidth=2;c.strokeRect(px+1,py+1,T-2,T-2);
   if(t==3){c.fillStyle='#fff';c.font='bold '+(18+Math.sin(fr*.1)*2)+'px system-ui';c.textAlign='center';c.fillText('★',px+16,py+23)}}}
 // bendera finish
 const fx=L.fx-cam;c.fillStyle='#ccc';c.fillRect(fx,130,5,254);c.fillStyle='#ffd23a';c.beginPath();c.arc(fx+2,128,6,0,7);c.fill();
 const w=Math.sin(fr*.1)*3;c.fillStyle='#d6102a';c.fillRect(fx+5,136,50,16+w);c.fillStyle='#fff';c.fillRect(fx+5,152+w,50,16-w);
 c.fillStyle='#d6102a';c.fillRect(fx+90,300,14,84);c.fillRect(fx+150,300,14,84);c.fillStyle='#fff';c.fillRect(fx+90,320,14,10);c.fillRect(fx+150,320,14,10);c.fillRect(fx+90,350,14,10);c.fillRect(fx+150,350,14,10);
 c.fillStyle='#d6102a';c.fillRect(fx+84,286,86,16);
 for(const q of L.co)if(!q.g){const sw=Math.abs(Math.cos(fr*.08+q.x));c.fillStyle='#ffc400';c.beginPath();c.ellipse(q.x-cam,q.y,8*sw+1,9,0,0,7);c.fill();c.fillStyle='#fff3a0';c.fillRect(q.x-cam-1,q.y-5,2,8)}
 for(const e of L.en)snail(e);
 if(st!='over'&&(p.inv%8<5||st=='lvl'))kid(p.x-cam-0,p.y,p.f,p.an,sel==1,!p.g);
 for(const q of P){c.fillStyle=q.c;c.fillRect(q.x-cam,q.y,4,4)}}
function hud(){c.textAlign='left';c.font='bold 20px system-ui';c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,0,800,34);
 c.fillStyle='#ff4d5e';c.fillText('♥'.repeat(Math.max(0,lives)),12,24);c.fillStyle='#ffd23a';c.fillText('● '+coins,130,24);c.fillStyle='#fff';c.fillText('Skor '+String(score).padStart(6,'0'),230,24);
 c.textAlign='right';c.fillText((lvl+1)+'. '+NM[lvl],760,24);c.fillText(mus?'♪':'×',790,24)}
function txt(s,x,y,sz,col){c.font='bold '+sz+'px system-ui';c.textAlign='center';c.fillStyle='rgba(0,0,0,.5)';c.fillText(s,x+3,y+3);c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function draw(){
 if(st=='menu'){bg(0);c.fillStyle='#3fae3a';c.fillRect(0,384,800,66);txt('PETUALANGAN ILMU',400,86,46,'#ffd23a');txt('Si Anak SD Nusantara',400,134,28,'#fff');
  txt('Pilih karakter, ketuk untuk mulai',400,176,20);
  [['Budi',0],['Sari',1]].forEach(([nm,i])=>{const x=i?440:170;c.fillStyle=sel==i?'rgba(255,255,255,.9)':'rgba(255,255,255,.45)';c.fillRect(x,196,190,190);
   c.strokeStyle=sel==i?'#d6102a':'#fff';c.lineWidth=4;c.strokeRect(x,196,190,190);kid(x+95-40,226+Math.sin(fr*.1+i)*3,1,fr*.15,i==1,0,4);
   c.font='bold 20px system-ui';c.fillStyle='#222';c.textAlign='center';c.fillText(nm+(i?' (cewek)':' (cowok)'),x+95,376)});
  if(innerHeight>innerWidth)txt('Putar HP ke mode landscape',400,420,18,'#fff');
  else txt('◀ ▶ / A D = jalan   Spasi = lompat   Shift = lari',400,420,16)}
 else if(L){world();hud();
  if(st=='lvl'){txt('SELAMAT!',400,170,52,'#ffd23a');txt(lvl<NL-1?'Menuju toko...':'Kamu juara!',400,220,24)}
  if(st=='over'){c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,800,450);txt('COBA LAGI, YA!',400,190,48,'#ff6a6a');txt('Skor '+score,400,240,28);txt('Ketuk untuk kembali',400,290,20)}
  if(st=='win'){c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,800,450);txt('JUARA SEKOLAH!',400,170,50,'#ffd23a');txt('Skor akhir '+score,400,230,30);txt('Ketuk untuk main lagi',400,290,20);
   for(let i=0;i<3;i++){const a=fr*.05+i*2.1;c.fillStyle=['#d6102a','#fff','#ffd23a'][i];c.fillRect(400+Math.cos(a)*220,330+Math.sin(a)*30,10,10)}}}}
let last=performance.now(),acc=0;
function loop(t){requestAnimationFrame(loop);acc+=Math.min(50,t-last);last=t;while(acc>=16.67){upd();acc-=16.67}draw()}
requestAnimationFrame(loop);
// ---------- INPUT ----------
function jp(){p&&(p.jb=8)}
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'a',w:'a',' ':'a',Shift:'b',z:'b'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){K[k]=1;if(k=='a'&&!e.repeat)jp();e.preventDefault()}
 if(e.key=='m')mus=!mus;
